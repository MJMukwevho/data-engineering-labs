# Submit to the local standalone cluster by default
spark.master                                   spark://spark-master:7077

# s3a:// points at the local S3-compatible object store instead of AWS.
# On AWS, drop the endpoint/path-style lines and let IAM roles supply credentials.
spark.hadoop.fs.s3a.endpoint                   http://object-store:9000
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
# Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, set in compose.yaml
spark.hadoop.fs.s3a.aws.credentials.provider   com.amazonaws.auth.EnvironmentVariableCredentialsProvider
